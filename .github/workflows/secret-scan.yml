name: Secret scan

on:
  push:
    branches:
      - main
      - prod
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runway-credentials:
    name: Runway credentials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reject committed Runway credentials
        run: bash scripts/check-no-runway-secrets.sh
