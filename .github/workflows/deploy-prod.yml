name: Deploy API

on:
  push:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the built image to the production API fleet
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::139194331469:role/bigmelo-prod-github-actions-deploy-role
  ECR_REPOSITORY: bigmelo/voitity-api
  AUTO_SCALING_GROUP: bigmelo-prod-api
  LEGACY_EC2_INSTANCE_ID: i-0133c4ba00b95904d

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reject committed Runway credentials
        run: bash scripts/check-no-runway-secrets.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:prod

      - name: Deploy sequentially and run migrations once
        if: github.event_name == 'push' || inputs.deploy
        env:
          PROFILE_DOMAIN_CONNECTION_GROUP_ID: ${{ vars.PROFILE_DOMAIN_CONNECTION_GROUP_ID }}
          PROFILE_DOMAIN_DISTRIBUTION_ID: ${{ vars.PROFILE_DOMAIN_DISTRIBUTION_ID }}
          PROFILE_DOMAIN_ROUTING_ENDPOINT: ${{ vars.PROFILE_DOMAIN_ROUTING_ENDPOINT }}
        run: |
          set -euo pipefail

          [[ "$PROFILE_DOMAIN_CONNECTION_GROUP_ID" =~ ^cg_[A-Za-z0-9]+$ ]]
          [[ "$PROFILE_DOMAIN_DISTRIBUTION_ID" =~ ^E[A-Z0-9]+$ ]]
          [[ "$PROFILE_DOMAIN_ROUTING_ENDPOINT" =~ ^[A-Za-z0-9.-]+$ ]]

          BIGMELO_SYNC_SCRIPT_URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/deploy/sync-production-env.sh"
          BIGMELO_SYNC_COMMAND="\"\$BIGMELO_SYNC_SCRIPT\" /opt/bigmelo/api '$PROFILE_DOMAIN_DISTRIBUTION_ID' '$PROFILE_DOMAIN_CONNECTION_GROUP_ID' '$PROFILE_DOMAIN_ROUTING_ENDPOINT'"

          INSTANCE_IDS="$(aws autoscaling describe-auto-scaling-groups \
            --region "$AWS_REGION" \
            --auto-scaling-group-names "$AUTO_SCALING_GROUP" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text)"

          if [ -z "$INSTANCE_IDS" ] || [ "$INSTANCE_IDS" = "None" ]; then
            INSTANCE_IDS="$LEGACY_EC2_INSTANCE_ID"
          fi

          run_on_instance() {
            local instance_id="$1"
            local run_migrations="$2"
            local migration_command="true"

            if [ "$run_migrations" = "true" ]; then
              migration_command="/usr/local/bin/docker-compose run --rm api php artisan migrate --force && /usr/local/bin/docker-compose run --rm api php artisan products:refresh-social-images"
            fi

            local commands
            commands="$(jq -cn \
              --arg sync_script_url "$BIGMELO_SYNC_SCRIPT_URL" \
              --arg sync_command "$BIGMELO_SYNC_COMMAND" \
              --arg migration_command "$migration_command" \
              '[
                "set -euo pipefail",
                "cd /opt/bigmelo/api",
                "BIGMELO_SYNC_SCRIPT=$(mktemp)",
                "trap '\''rm -f \"$BIGMELO_SYNC_SCRIPT\"'\'' EXIT",
                ("curl --fail --silent --show-error --location " + ($sync_script_url | @sh) + " --output \"$BIGMELO_SYNC_SCRIPT\""),
                "chmod 700 \"$BIGMELO_SYNC_SCRIPT\"",
                $sync_command,
                "test -s .env",
                "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 139194331469.dkr.ecr.us-east-1.amazonaws.com",
                "docker pull 139194331469.dkr.ecr.us-east-1.amazonaws.com/bigmelo/voitity-api:prod",
                "/usr/local/bin/docker-compose run --rm api php artisan optimize:clear",
                $migration_command,
                "/usr/local/bin/docker-compose up -d --force-recreate --remove-orphans",
                "/usr/local/bin/docker-compose exec -T api php artisan optimize",
                "/usr/local/bin/docker-compose exec -T api php artisan queue:restart || true",
                "for attempt in $(seq 1 60); do curl --fail --silent http://127.0.0.1/health/ready && exit 0; sleep 5; done; exit 1"
              ]')"

            local command_id
            command_id="$(aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$instance_id" \
              --document-name AWS-RunShellScript \
              --comment "Deploy $GITHUB_REPOSITORY@$GITHUB_SHA" \
              --parameters "$(jq -cn --argjson commands "$commands" '{commands: $commands}')" \
              --query Command.CommandId \
              --output text)"

            for attempt in {1..120}; do
              local status
              status="$(aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$command_id" \
                --instance-id "$instance_id" \
                --query Status \
                --output text 2>/dev/null || true)"

              case "$status" in
                Success)
                  aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$instance_id" --query StandardOutputContent --output text
                  return 0
                  ;;
                Failed|Cancelled|TimedOut)
                  aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$instance_id" --query StandardOutputContent --output text || true
                  aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$instance_id" --query StandardErrorContent --output text || true
                  return 1
                  ;;
              esac

              sleep 5
            done

            echo "Timed out waiting for SSM command $command_id on $instance_id"
            return 1
          }

          migration_pending=true
          for instance_id in $INSTANCE_IDS; do
            run_on_instance "$instance_id" "$migration_pending"
            migration_pending=false
          done
